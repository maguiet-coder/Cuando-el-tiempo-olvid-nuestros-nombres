<style>
:root{--cuero:#1a1411;--cuero2:#251c17;--papel:#eadfc6;--tinta:#2a2018;--sello:#8e2a35;--sello2:#a93946;--oro:#b8955a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% 0,var(--cuero2),var(--cuero) 70%) fixed;color:var(--papel);font:1.2rem/1.6 'Cormorant Garamond',Georgia,serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:24px 18px 60px}
h1,h2{font-family:'IM Fell English',Georgia,serif;font-weight:400;line-height:1.15}
.portada{min-height:90vh;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:28px}
.portada h1{font-size:clamp(2.2rem,8vw,3.6rem);margin:0}
.portada em{font-style:italic;color:var(--oro)}
.nom span{animation:borra 6s ease-in forwards;animation-delay:calc(var(--i)*.55s + 1.5s)}
@keyframes borra{to{opacity:.07;filter:blur(1.5px)}}
.sub{font-style:italic;opacity:.8;margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:3px;padding:.55em 1.3em;background:var(--sello);color:#f6ead3;letter-spacing:.02em}
button:hover{background:var(--sello2)}
button.dos{background:transparent;color:var(--oro);border:1px solid var(--oro)}
button.dos:hover{background:#ffffff10}
button:focus-visible,input:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
.acc{display:flex;flex-direction:column;align-items:center;gap:12px}
.hoja{background:var(--papel);color:var(--tinta);padding:26px 24px;border-radius:2px;box-shadow:0 10px 30px #0008}
.hoja h2{margin:0 0 .4em;font-size:1.8rem}
.hoja p{margin:.7em 0}
.cap{font-style:italic;color:var(--oro);margin:0 0 10px;text-align:center}
.carta{border-left:3px solid var(--sello);padding-left:14px;font-style:italic}
.bar{height:3px;background:#ffffff18;margin-bottom:22px}.bar i{display:block;height:100%;background:var(--oro)}
.fila{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
input[type=text]{flex:1;min-width:140px;font:inherit;padding:.45em .7em;background:#fff8;border:1px solid #2a201855;color:var(--tinta);border-radius:2px}
.fb{min-height:1.6em;margin-top:12px;font-style:italic}.ok{color:#2c6b3a}.mal{color:var(--sello)}
.pista{margin-top:10px;font-size:1rem;border-top:1px dashed #2a201860;padding-top:8px}
table.g{border-collapse:collapse;margin:14px auto;font-family:'IM Fell English',serif}
table.g td{width:34px;height:34px;text-align:center;border:1px solid #2a201833;cursor:pointer;font-size:1.2rem}
table.g td.on{background:#8e2a3540}
.cr{margin:10px 0}.cr small{display:block;margin-bottom:3px}
.cr .c{display:flex;gap:2px}
.cr input{width:34px;height:34px;text-align:center;font:inherit;text-transform:uppercase;background:#fff8;border:1px solid #2a201866;padding:0;border-radius:0;color:var(--tinta)}
.cr input.k{background:#b8955a77;border-color:var(--sello)}
.cr.bien input{border-color:#2c6b3a}
ul.cl{padding-left:1.1em;margin:.5em 0}
@media(prefers-reduced-motion:reduce){.nom span{animation:none}}

/* Rediseño: novela interactiva de archivo */
:root{--cuero:#100e0d;--cuero2:#211916;--papel:#f0e5cf;--tinta:#30251d;--sello:#762b32;--sello2:#9a4148;--oro:#c5a36b}
body{background:
 radial-gradient(ellipse at 50% 8%,#3a2920 0%,transparent 48%),
 radial-gradient(ellipse at 50% 100%,#1d1714 0%,#100e0d 68%) fixed;
 color:#e9ddc7;letter-spacing:.012em}
main{max-width:760px;padding:28px 22px 72px}
.portada{min-height:92vh;gap:25px;position:relative}
.portada:before{content:"";position:absolute;inset:8% 5%;border:1px solid #c5a36b35;pointer-events:none}
.portada h1{max-width:650px;margin:0 auto;font-size:clamp(2.7rem,9vw,5.1rem);text-shadow:0 4px 24px #0008;letter-spacing:-.025em}
.portada .sub{font-size:1.15rem;letter-spacing:.08em}
.portada .sub:first-child{text-transform:uppercase;font-size:.82rem;letter-spacing:.2em;color:var(--oro)}
.nom span{animation:borra 7s ease-in forwards;animation-delay:calc(var(--i)*.55s + 1.5s)}
button{border:1px solid #a34a4e;background:linear-gradient(135deg,#87353c,#63252b);padding:.7em 1.5em;box-shadow:0 5px 18px #0004;transition:transform .2s,filter .2s,background .2s}
button:hover{background:linear-gradient(135deg,#a34850,#793038);transform:translateY(-1px);filter:brightness(1.08)}
button.dos{border-color:#b8955a;color:#d9bd8b;background:#ffffff08;box-shadow:none}
.hoja{position:relative;background:linear-gradient(145deg,#f3e9d5,#e6d8bc);padding:clamp(25px,5vw,42px);border:1px solid #c5a36b;box-shadow:0 22px 55px #0008,0 0 0 5px #ffffff08;color:#30251d}
.hoja:before{content:"";position:absolute;inset:9px;border:1px solid #8e76534a;pointer-events:none}
.hoja h2{font-size:clamp(2rem,6vw,2.7rem);text-align:center;margin:0 0 22px;color:#4b3027}
.hoja p{font-size:1.22rem;line-height:1.72}
.hoja .carta{color:#74313a;border-left-color:#8e2a35}
.cap{margin:0 auto 15px;text-align:center;text-transform:uppercase;letter-spacing:.17em;font-size:.82rem;color:#d1b47e}
.bar{height:3px;background:#ffffff18;margin:0 0 18px;border-radius:4px;overflow:hidden}
.bar i{background:linear-gradient(90deg,#8c343d,#d1b47e);transition:width .35s}
.fila{justify-content:center}
input[type=text]{background:#fffaf0;border:1px solid #bba98a}
.fb{font-size:1.1rem;text-align:center}
.pista{color:#6b4c36}
.audio-dock{position:fixed;right:18px;bottom:18px;z-index:5;display:flex;align-items:center;gap:9px;padding:8px 12px;border:1px solid #c5a36b55;border-radius:30px;background:#17110fee;box-shadow:0 8px 24px #0008;font: .9rem Georgia,serif;color:#ddc99f}
.audio-dock button{padding:5px 11px;font-size:.85rem;border-radius:20px}
.capitulo{font-size:.9rem;letter-spacing:.13em;text-transform:uppercase;color:#bfa16d;text-align:center;margin:4px 0 12px}
.restantes{font-style:italic;text-align:center;color:#cdbb98;font-size:.95rem;margin:10px 0 0}
@media(max-width:520px){main{padding:18px 14px 90px}.hoja{padding:25px 20px}.audio-dock{right:10px;bottom:10px}}


/* Ambientación y lectura: interfaz más clara y con pequeños movimientos */
body{font-family:'Lora',Georgia,serif;line-height:1.72}
main{max-width:820px}
h1,h2{font-family:'Lora',Georgia,serif;font-weight:600;letter-spacing:-.025em}
button,.audio-dock,.hud,.restantes,.cap,.pista,.fb,.cr small{font-family:'Nunito Sans',Arial,sans-serif}
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:2px 0 15px}
.hud-chip{display:inline-flex;align-items:center;gap:8px;max-width:48%;min-height:36px;padding:7px 12px;border:1px solid #c5a36b55;border-radius:3px;background:linear-gradient(135deg,#211915dd,#15110fee);color:#e5d2ad;font:600 .78rem/1.2 'Nunito Sans',sans-serif;letter-spacing:.045em;box-shadow:0 4px 16px #0003}
.hud-chip:first-child{border-left:2px solid #c5a36b}
.hud-chip:last-child{border-right:2px solid #8e4248;text-align:right;justify-content:flex-end}
.hud-chip .mini-icon{color:#d1b47e;font-size:1rem}
.bar{margin:0 0 23px;height:2px;background:#ffffff20}
.bar i{height:100%;box-shadow:0 0 10px #d1b47e66}
.cap{font:600 .76rem 'Nunito Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#8b674d;margin:0 0 14px;text-align:center}
.hoja{overflow:hidden;animation:hojaEntra .65s cubic-bezier(.2,.7,.2,1) both}
.hoja:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;background:repeating-linear-gradient(0deg,transparent 0 31px,#8d76531a 32px)}
.hoja>*{position:relative;z-index:1}
.hoja h2{font-size:clamp(1.75rem,5vw,2.45rem);margin-bottom:20px}
.hoja p{font-size:clamp(1.04rem,2.8vw,1.16rem);line-height:1.85}
.hoja .carta{display:block;position:relative;margin:20px 0;padding:16px 18px 16px 20px;background:#e6d5b8;border-left:3px solid #8e2a35;color:#71343a;box-shadow:0 5px 16px #49311a18;font-style:italic}
.hoja .carta:after{content:"";position:absolute;right:12px;bottom:8px;width:23px;height:23px;border:1px solid #9a414866;border-radius:50%;opacity:.45}
.hoja p:nth-of-type(1){animation:textoEntra .55s .08s both}
.hoja p:nth-of-type(2){animation:textoEntra .55s .18s both}
.hoja p:nth-of-type(3){animation:textoEntra .55s .28s both}
.hoja.acertijo{background:linear-gradient(145deg,#f4ead8,#e8dbc2)}
.hoja.acertijo h2{padding-bottom:15px;border-bottom:1px solid #9d815044}
.hoja.acertijo h2:before{content:"✦";display:block;margin-bottom:8px;color:#a27c48;font-size:.8rem;letter-spacing:.3em}
.fila{margin-top:22px}
.fila button{min-width:132px}
input[type=text],.cr input{font-family:'Nunito Sans',Arial,sans-serif}
input[type=text]{font-size:1rem;padding:.7em .85em}
table.g td{font-family:'Nunito Sans',Arial,sans-serif;font-weight:600;transition:background .15s,transform .15s}
table.g td:hover{background:#b8955a55;transform:scale(1.05)}
table.g td.on{background:#a64b4d55;box-shadow:inset 0 0 0 2px #8e2a3577}
.fb.ok{animation:acierto .5s ease}
.pista{background:#efe2ca;padding:12px 14px;border-left:2px solid #b8955a;animation:textoEntra .3s ease both}
.acc{position:relative}
.acc:before{content:"";width:48px;height:1px;background:#b8955a66;margin:0 auto 4px}
.portada:after{content:"✦   ❦   ✦";position:absolute;bottom:8%;left:0;right:0;color:#c5a36b88;font-size:1.1rem;letter-spacing:.5em}
.portada:before{border:1px solid #c5a36b55;box-shadow:inset 0 0 0 7px #c5a36b0b}
.audio-dock{font-family:'Nunito Sans',Arial,sans-serif;backdrop-filter:blur(8px)}
@keyframes hojaEntra{from{opacity:0;transform:translateY(16px) rotateX(1deg)}to{opacity:1;transform:translateY(0) rotateX(0)}}
@keyframes textoEntra{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes acierto{0%{transform:scale(.98)}55%{transform:scale(1.025)}100%{transform:scale(1)}}
@media(max-width:520px){
 .hud-chip{font-size:.7rem;padding:7px 8px;max-width:49%}
 .hoja p{line-height:1.75}
}
@media(prefers-reduced-motion:reduce){
 .hoja,.hoja p,.fb.ok,.pista{animation:none!important}
}


.logic-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.logic-grid label{display:flex;flex-direction:column;gap:6px;padding:12px;background:#e6d8bc;border:1px solid #bba77f;color:#493629;font:600 .9rem 'Nunito Sans',sans-serif}
.logic-grid select{width:100%;padding:9px;background:#fffaf0;border:1px solid #bba98a;color:#30251d;font: .95rem 'Nunito Sans',sans-serif}

 position:fixed;top:18px;left:18px;z-index:20;min-width:154px;min-height:58px;

.resultado-panel.abierto{transform:translateX(0)}

.resultado-item small{font:600 .72rem 'Nunito Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#936e45}
.resultado-item h3{font:600 1rem 'Lora',serif;color:#583b2d;margin:5px 0}
.resultado-item p{margin:5px 0 0;line-height:1.55}
.resultado-vacio{padding:18px 0;font:italic 1rem 'Lora',serif;color:#765a43}
.diario-toggle{position:fixed;right:16px;top:18px;z-index:20;border:1px solid #c5a36b99;background:#17110fee;color:#e8d4ad;border-radius:4px;padding:10px 13px;font:600 .85rem 'Nunito Sans',sans-serif;box-shadow:0 6px 20px #0006}
.diario-toggle .alerta{display:inline-block;margin-left:6px;color:#ffcf72;font-size:1.05rem}
.diario-panel{position:fixed;inset:0 0 0 auto;width:min(430px,94vw);z-index:30;background:linear-gradient(145deg,#f1e5ce,#dfcfaf);color:#30251d;box-shadow:-18px 0 45px #0009;transform:translateX(105%);transition:transform .35s ease;padding:24px 22px;overflow:auto}
.diario-panel.abierto{transform:translateX(0)}
.diario-panel h2{font-family:'Lora',serif;color:#583b2d;margin:20px 0 6px}
.diario-cierre{float:right;background:#6e2b32;padding:6px 11px}
.diario-intro{font:italic .95rem 'Lora',serif;color:#765a43;border-bottom:1px solid #9c805655;padding-bottom:14px}
.diario-entry{padding:14px 0;border-bottom:1px dashed #9c805688}
.diario-entry small{font:600 .72rem 'Nunito Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#936e45}
.diario-entry p{margin:7px 0 0;line-height:1.65}
.solucion-btn{display:block;margin:18px auto 0;background:transparent;color:#75512f;border:1px dashed #9c8056;box-shadow:none;font-size:.88rem}
.solucion-text{display:none;margin-top:10px;padding:12px 14px;background:#e6d6b8;border-left:3px solid #b8955a;color:#533d2c;font:.95rem/1.6 'Lora',serif}
.solucion-text.visible{display:block}
.logic-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.logic-grid label{display:flex;flex-direction:column;gap:6px;padding:12px;background:#e6d8bc;border:1px solid #bba77f;color:#493629;font:600 .9rem 'Nunito Sans',sans-serif}
.logic-grid select{width:100%;padding:9px;background:#fffaf0;border:1px solid #bba98a;color:#30251d;font:.95rem 'Nunito Sans',sans-serif}
@media(max-width:520px){.diario-toggle{top:auto;bottom:76px;right:10px}.diario-panel{padding:20px 17px}}

<script>
const M=document.getElementById('m');
const N=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const TOTAL=36; // acertijos totales de la historia
let i=0,prog=0;
try{prog=+localStorage.getItem('ctn_v2')||0}catch(e){}
const save=()=>{try{localStorage.setItem('ctn_v2',Math.max(prog,i))}catch(e){}};

// Música: las dos piezas se alternan y vuelven a empezar en bucle.
const tracks=['The Final Piece.mp3','The Final Clue.mp3','The_Unresolved_Tick.mp3','Time_Slipping_Away.mp3'];
let trackIndex=0, musicStarted=false, musicMuted=false;
const music=new Audio(tracks[0]); music.preload='auto'; music.volume=.19;
music.addEventListener('ended',()=>{trackIndex=(trackIndex+1)%tracks.length;music.src=tracks[trackIndex];if(!musicMuted)music.play().catch(()=>{});updateMusicLabel()});
function startMusic(){soundAllowed=true;if(musicStarted)return;musicStarted=true;music.play().then(updateMusicLabel).catch(()=>{musicStarted=false})}
function updateMusicLabel(){const b=document.getElementById('musicToggle');if(b)b.textContent=musicMuted?'Activar música':'Pausar música'}
function nextTrack(){trackIndex=(trackIndex+1)%tracks.length;music.src=tracks[trackIndex];if(!musicMuted){musicStarted=true;music.play().catch(()=>{});}}
function musicDock(){if(!document.getElementById('musicDock')){const dock=document.createElement('div');dock.className='audio-dock';dock.id='musicDock';dock.innerHTML='<span>♪ Banda sonora</span><button id="musicToggle" type="button">Pausar música</button><button id="musicNext" type="button" title="Siguiente canción" aria-label="Siguiente canción">⏭</button>';document.body.appendChild(dock);document.getElementById('musicToggle').onclick=()=>{musicMuted=!musicMuted;if(musicMuted)music.pause();else if(musicStarted)music.play().catch(()=>{});updateMusicLabel()};document.getElementById('musicNext').onclick=()=>nextTrack();updateMusicLabel()}} 

const pageSound=new Audio('pasar-pagina.mp3');pageSound.preload='auto';pageSound.volume=1;pageSound.load();
// Banda sonora exclusiva del salto de capítulo: entrada y salida con fundido suave.
const eraSound=new Audio('Temporal Threshold(1).mp3');
eraSound.preload='auto';eraSound.volume=0;
let eraSoundFade=null;
function playEraSound(){
  if(!soundAllowed)return;
  if(eraSoundFade)clearInterval(eraSoundFade);
  try{
    eraSound.pause();eraSound.currentTime=0;eraSound.volume=0;
    const attempt=eraSound.play();if(attempt&&attempt.catch)attempt.catch(()=>{});
    const start=performance.now();
    eraSoundFade=setInterval(()=>{
      const p=Math.min(1,(performance.now()-start)/1800);
      eraSound.volume=.38*p;
      if(p>=1){clearInterval(eraSoundFade);eraSoundFade=null}
    },50);
  }catch(e){}
}
function stopEraSound(){
  if(eraSoundFade)clearInterval(eraSoundFade);
  const initial=eraSound.volume,start=performance.now();
  eraSoundFade=setInterval(()=>{
    const p=Math.min(1,(performance.now()-start)/1400);
    eraSound.volume=initial*(1-p);

/* El diario de Clara no comenta cada prueba: solo escribe cuando tiene algo que decir.

const DIARIO={"La caja sin remitente": {"fecha": "Martes, 10 de noviembre", "titulo": "La caja", "entradas": ["Han dejado una caja de madera en el portal. Sin remitente, sin mensajería, sin nadie que la haya visto llegar.", "La letra de la nota es la del abuelo. La he comparado con una postal suya de 2014: la misma ese torcida, el mismo punto que se le escapa de la línea. Llevo una hora diciéndome que habrá una explicación razonable. No se me ocurre ninguna."]}, "El libro de cuero negro": {"fecha": "Martes, 10 de noviembre, muy tarde", "titulo": "Dentro", "entradas": ["No he dormido. Dentro de la caja hay un libro de cuero negro, sin título y sin autor, y entre sus páginas hay fotografías de épocas que no deberían estar juntas."]}, "Dos rostros, muchos siglos": {"fecha": "Miércoles, 11 de noviembre", "titulo": "El mismo rostro", "entradas": ["He visto el mismo rostro en tres imágenes separadas por siglos. El mismo. No un parecido: el mismo.", "He cerrado el libro. Lo he vuelto a abrir. Sigue ahí."]}, "La clave de César": {"fecha": "Miércoles, 11 de noviembre, tarde", "titulo": "Números", "entradas": ["He estado una hora con las letras romanas y no se me iba de la cabeza otra cosa: el abuelo me enseñó este juego cuando tenía nueve años. Me decía que los mensajes se esconden, no se cierran con llave.", "¿Por qué me enseñaría eso a mí y no a nadie más?"]}, "La carta del amante": {"fecha": "Jueves, 12 de noviembre", "titulo": "Livia", "entradas": ["La carta es lo peor. Está escrita por alguien que sabía que quizá no volvería a ver a la persona a la que escribía, y aun así habla del futuro como si fuera suyo."]}, "El nombre de la víctima": {"fecha": "Jueves, 12 de noviembre, de madrugada", "titulo": "Un nombre", "entradas": ["Livia. Ya tiene nombre. Llevo media vida estudiando documentos y nunca había sentido que un nombre me mirase de vuelta."]}, "Cinco sombras en la villa": {"fecha": "Viernes, 13 de noviembre", "titulo": "Cinco sombras", "entradas": ["El libro no es un archivo. Alguien lo está usando como si fuera una conversación, y yo acabo de contestar."]}, "El mercader de rostro conocido": {"fecha": "Viernes, 13 de noviembre, noche", "titulo": "Druso", "entradas": ["El mercader del grabado es el hombre del fondo de todas las fotografías. Lo he comprobado cuatro veces con la lupa de la facultad.", "Mañana preguntaré en el archivo por el abuelo. No por la caja. Todavía no."]}, "El anillo y un poema": {"fecha": "Domingo, 15 de noviembre", "titulo": "Dos días en blanco", "entradas": ["He intentado trabajar en la tesis. He estado dos horas delante de la misma página.", "Un anillo y un poema escrito la noche antes de morir. No sé qué hacer con esto. No es una tragedia antigua: es una promesa que alguien dejó a medias y que ahora está en mi mesa."]}, "Continuará": {"fecha": "Domingo, 15 de noviembre, 23:40", "titulo": "El sobre", "entradas": ["Alguien ha deslizado un sobre por debajo de mi puerta. La letra es la del libro, no la del abuelo.", "No he llamado a nadie. Primero he cerrado la ventana. Después he pensado en quién sabe que tengo esto."]}, "La ciudad de las campanas": {"fecha": "Lunes, 16 de noviembre", "titulo": "Florencia", "entradas": ["Un billete de tren, pagado, a mi nombre. Abril de 1498 escrito en tinta roja sobre el reverso.", "He hecho la maleta en veinte minutos. Eso también me asusta: lo poco que me ha costado decidirlo."]}, "El taller de los secretos": {"fecha": "Martes, 17 de noviembre, Florencia", "titulo": "Isabella", "entradas": ["En Florencia el libro pesa distinto. Suena exagerado, lo sé. Pero lo llevo en la mochila y juraría que está tibio."]}, "La carta escondida en el marco": {"fecha": "Martes, 17 de noviembre, tarde", "titulo": "Leonardo", "entradas": ["Leonardo no robó el retrato: lo escondió. Es la primera vez en toda la historia que alguien esconde algo para proteger a otra persona y no para salvarse a sí mismo.", "He pensado en el abuelo. En si él también escondió algo así."]}, "El testimonio de Matteo": {"fecha": "Miércoles, 18 de noviembre", "titulo": "Dos versiones", "entradas": ["Matteo dice que oyó la campana desde el patio. Antes había dicho que estaba en el almacén. Puede ser un despiste. O puede ser lo que llevo tres días encontrándome en cada página."]}, "Una firma detrás del lienzo": {"fecha": "Miércoles, 18 de noviembre, noche", "titulo": "A.", "entradas": ["Una firma: «A.», 1889. El abuelo escribió que el rostro no envejece. Lo escribió como una advertencia, no como un hallazgo.", "Quiero llamar a mi madre y preguntarle por él. No lo voy a hacer. No todavía."]}, "El nombre del margen": {"fecha": "Jueves, 19 de noviembre", "titulo": "Aurelio", "entradas": ["Aurelio. Mi abuelo. Su nombre está escrito en el margen de un libro que no debería existir. No sé si me está guiando o si estoy siguiendo algo que él no quería que encontrase."]}, "El sobre de 1889": {"fecha": "Jueves, 19 de noviembre, 02:15", "titulo": "No confiar", "entradas": ["«No confíes en el hombre que restaura los recuerdos.»", "Adrián restaura documentos. Adrián me ha llamado cuatro veces esta semana y le he dicho que estaba cansada."]}};
function diaryNote(d,idx){
 if(diary.some(x=>x.idx===idx))return;
 const n=DIARIO[d.h];
 if(!n)return; // Clara no escribe en todas las páginas: los silencios también son parte del diario.
 diary.push({idx,chapter:chapterName(idx),title:n.titulo||d.h,date:n.fecha||new Date().toLocaleDateString('es-ES'),entradas:n.entradas.slice()});
 saveDiary();
}

// Clara también deja constancia de lo que siente al cruzar de una época a otra.
function diaryTravelNote(ch){
 const idViaje=10000+ch;
 if(diary.some(x=>x.idx===idViaje))return;
 const notas={
  1:{chapter:'Capítulo 1 · Roma, 79 d. C.',title:'Un lugar que no debería existir',date:'Roma, 79 d. C.',entradas:[
   'No sé cómo describirlo sin que parezca que he perdido la cabeza. Hace un momento estaba en mi habitación, en 2026, y ahora el aire huele a humo, a piedra caliente y a algo dulce que no consigo reconocer. La luz también es distinta. No es una pantalla ni una recreación: el sol me da en la cara y tengo calor de verdad.',
   'Me siento rarísima. Tengo el estómago revuelto, las piernas un poco flojas y la sensación de haberme despertado dentro de un recuerdo ajeno. La gente pasa a mi lado sin mirarme dos veces. Para ellos pertenezco aquí. Para mí, nada encaja.',
   'He mirado la fecha tres veces. Setenta y nueve después de Cristo. Si esto es real, estoy caminando por un mundo que hace casi dos mil años que desapareció. Y, aun así, una parte de mí reconoce este lugar. Eso es lo que más miedo me da.'
  ]},
  2:{chapter:'Capítulo 2 · Florencia, 1498',title:'El tiempo se me ha quedado dentro',date:'Florencia, abril de 1498',entradas:[
   'Otra vez esa presión en los oídos, el vuelco en el estómago y unos segundos en los que no sabía dónde terminaba mi cuerpo. El viaje ha sido más corto esta vez, pero no menos extraño. Todavía noto el zumbido en los dientes, como si el tiempo hubiera pasado rozándome demasiado cerca.',
   'Florencia huele a madera, aceite y lluvia sobre piedra. Las voces tienen otro ritmo; hasta el silencio parece distinto. Me he sorprendido buscando coches, cables, cualquier señal de mi siglo. No hay nada. Solo talleres, campanas y personas que no tienen ni idea de lo que vendrá después.',
   'Empiezo a temer que no solo estoy viajando a otros años. Cada vez que llego, tardo un poco más en sentir que sigo siendo la misma Clara. Necesito escribirlo para no acostumbrarme.'
  ]},
  3:{chapter:'Regreso · Barcelona, 2026',title:'He vuelto, pero no del todo',date:'Barcelona, noviembre de 2026',entradas:[
   'He vuelto a mi época. Las luces, los motores y el ruido de la calle deberían tranquilizarme, pero todo me parece demasiado rápido y demasiado brillante. He mirado el móvil para comprobar la fecha. 2026. Mi fecha. Aun así, durante un instante he esperado oír las campanas de Florencia.',
   'Me tiemblan un poco las manos y tengo la impresión absurda de que, si cierro los ojos, volveré a notar el suelo de piedra bajo los pies. Me siento fuera de sitio en mi propia ciudad. La gente sigue con su vida y nadie puede imaginar dónde he estado.',
   'No sé si el libro me está cambiando o si soy yo quien empieza a mirar el mundo de otra manera. Solo sé que ya no puedo fingir que esto es una investigación normal. Tengo miedo. Y, por debajo del miedo, también quiero saber adónde me llevará la próxima página.'

 };
 const n=notas[ch];if(!n)return;
 diary.push({idx:idViaje,chapter:n.chapter,title:n.title,date:n.date,entradas:n.entradas});
 saveDiary();
}

function openResults(){
 const panel=document.getElementById('resultadoPanel');if(!panel)return;
 const actual=D[i];
 const enAcertijo=!!actual && actual.k==='p';
 const solved=D.slice(0,Math.min(prog,i)).map((d,idx)=>({d,idx})).filter(x=>x.d.k==='p');
 const list=document.getElementById('resultadoEntries');
 const titulo=document.getElementById('resultadoTitulo');
 const intro=document.getElementById('resultadoIntro');
 if(titulo)titulo.textContent=enAcertijo?'La página abierta':'Resultados de la investigación';
 if(intro)intro.textContent=enAcertijo?'Estás resolviendo un acertijo. Si el libro no cede, puedes mirar su solución.':'Las respuestas que Clara ha conseguido descifrar durante el camino.';
 const bloqueSolucion=enAcertijo&&actual.solution?`<div class="resultado-actual">
   <article class="resultado-item"><small>${chapterName(i)} · En curso</small><h3>${actual.h}</h3></article>
   <button class="solucion-panel-btn" id="solutionPanelToggle" type="button">Ver solución</button>
   <div class="solucion-panel-caja" id="solutionPanelBox" hidden><strong>Solución</strong>${actual.solution}</div>
   <p class="resultado-aviso">La solución no avanza la historia: Clara tiene que encontrar la respuesta para pasar la página.</p>
 </div>`:'';
 list.innerHTML=bloqueSolucion+(solved.length?solved.slice().reverse().map(({d,idx})=>`<article class="resultado-item"><small>${chapterName(idx)} · Acertijo ${D.slice(0,idx+1).filter(x=>x.k==='p').length}</small><h3>${d.h}</h3><p>${d.solution||'Prueba resuelta.'}</p></article>`).join(''):'<p class="resultado-vacio">Todavía no has resuelto ningún acertijo. Las soluciones aparecerán aquí a medida que avances.</p>');
 const st=document.getElementById('solutionPanelToggle');
 if(st)st.onclick=()=>{const box=document.getElementById('solutionPanelBox');const abierto=box.hasAttribute('hidden');abierto?box.removeAttribute('hidden'):box.setAttribute('hidden','');st.textContent=abierto?'Ocultar solución':'Ver solución'};
 panel.classList.add('abierto');
}

function chapterStart(idx){return idx<=7?0:(idx<=32?1:(idx<=58?2:(idx<=78?3:(idx<=102?4:(idx<=126?5:6)))))}
function chapterName(idx){const c=chapterStart(idx);return ({0:'Prólogo',1:'Capítulo I · Roma',2:'Capítulo II · Florencia',3:'Interludio · Barcelona',4:'Capítulo III · París',5:'Capítulo IV · Viena',6:'Capítulo V · Actualidad'})[c]}
function chapterPuzzleCount(idx){const ch=chapterStart(idx);return D.slice(idx).filter((x,j)=>x.k==='p' && chapterStart(idx+j)===ch).length}
function chapterDone(idx){return D.slice(idx+1).some((x,j)=>x.k==='p' && chapterStart(idx+1+j)===chapterStart(idx))===false}

{k:'p',n:5,solution:"VESUBIO: empieza en la V (fila 7, columna 8) y sube en diagonal hacia la izquierda hasta la O (fila 1, columna 2). Se lee al revés y en diagonal: la fila de abajo tiene un señuelo, VESUBA, al que le falta la O.",h:'Sopa de letras',t:'sopa',q:'La nota ya te ha dado el nombre: <b>VESUBIO</b>. Encuéntralo en la cuadrícula pulsando sus letras. Están juntas, en línea recta, y pueden estar escritas en cualquier dirección, también en diagonal y al revés. Cuidado con los señuelos.',g:['PONHEIXLG','JEIKTEIFF','ICIBXFEJL','BCJEUJJHE','UCEXNSMFN','SXLJMXERL','CJJTGLXVI','OJETQXFPZ','VESUBAJZG'],a:['vesubio','vesuvio'],hint:'No está en ninguna fila ni columna. Busca una diagonal y, si encuentras las letras, léelas al revés.'},

{k:'p',n:53,h:'La fecha romana',solution:"24: las Kalendas de septiembre (1 de septiembre) son el día I, la víspera (31 de agosto) el día II, y así hacia atrás: III es el 30, IV el 29, V el 28… IX cae el 24 de agosto, la fecha tradicional de la erupción del Vesubio.",q:'Los romanos no numeraban los días del mes de uno en uno: contaban hacia atrás desde la siguiente fecha fija, y las <i>Kalendas</i> eran el primer día del mes siguiente. Contaban incluyendo los dos extremos: las Kalendas de septiembre (1 de septiembre) eran el día I y la víspera (31 de agosto) el día II. Por ejemplo, <b>A. D. V KAL. SEPT.</b> era el 28 de agosto.<p class="carta"><b>A. D. IX KAL. SEPT.</b></p>¿Qué día de agosto señala la inscripción? Escribe solo el número.',a:['24','24 de agosto','24 agosto'],hint:'Cuenta hacia atrás desde el 1 de septiembre, contando también ese día como el primero. Agosto tiene 31 días.'},
